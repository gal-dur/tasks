# Pushing a vX.Y.Z tag publishes that release, carrying one binary per platform
# (tasks-<goos>-<goarch>, which install.sh resolves by uname). A push to master alone
# releases nothing: cutting a version is a deliberate act, and the tag is both the
# trigger and the name.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the master-ancestry check below walks it.
          fetch-depth: 0

      # A tag is branch-agnostic in git, so without this a version tagged on any
      # stray branch would release. Only what master carries gets published.
      - name: the tag must point into master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::${{ github.ref_name }} is not on master; refusing to release"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The board app builds once — the same dist embeds into every platform's binary.
      - name: build the app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run check

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go test ./...

      - name: build every platform
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            goos=${target%/*} goarch=${target#*/}
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
                -o "tasks-$goos-$goarch" ./cmd/tasks
          done

      # A published checksum, verified by install.sh before anything runs.
      - name: checksums
        run: sha256sum tasks-* > SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run of the same tag finds its release already there; replacing the
        # assets beats failing the whole workflow over idempotence.
        run: |
          gh release create "${{ github.ref_name }}" tasks-* SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --notes "tasks ${{ github.ref_name }} — one binary per platform" \
          || gh release upload "${{ github.ref_name }}" tasks-* SHA256SUMS --clobber
